name: math-trainer

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-math_trainer}
      POSTGRES_USER: ${DATABASE_USERNAME:-math_trainer}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: backend/MathTrainerApi
      dockerfile: ../../docker/dockerfiles/backend.Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-math_trainer}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-math_trainer}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/management/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: ../docker/dockerfiles/frontend.Dockerfile
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${DATABASE_VOLUME_NAME:-math-trainer-postgres-data}
