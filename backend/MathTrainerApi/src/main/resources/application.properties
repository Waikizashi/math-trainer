spring.application.name=MathTrainerApi
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/math_trainer}
spring.datasource.username=${DATABASE_USERNAME:math_trainer}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
management.endpoints.web.base-path=/api/management
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
